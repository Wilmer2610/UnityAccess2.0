services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn unity.wsgi:application --bind 0.0.0.0:8000 --no-control-socket"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-9e(zs90h&#m5gqxh3(j(cc#!4lvirfu-u-*h_3r+77r6%r%3=#
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/DBUnityAccess
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1] 0.0.0.0
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=DBUnityAccess
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

volumes:
  postgres_data:
