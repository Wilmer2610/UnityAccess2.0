databases:
  - name: unity-db
    databaseName: unity
    user: unity

services:
  - type: web
    name: unity-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn unity.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
